name: CI

on:
  push:
  pull_request:

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install root dependencies
        run: npm ci

  server-test:
    runs-on: ubuntu-latest
    needs: install
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm ci

      - name: Run server typecheck (if present)
        run: npm run typecheck --if-present

      - name: Run server tests
        run: npm test

      - name: Package server build artifact
        run: |
          cd ..
          mkdir -p server-artifact/server
          cp server/package.json server/package-lock.json server-artifact/server/
          cp -R server/src server-artifact/server/
          cp -R server/migrations server-artifact/server/
          tar -czf easyqr-server-build.tar.gz -C server-artifact server

      - name: Upload server build artifact
        uses: actions/upload-artifact@v4
        with:
          name: easyqr-server-build
          path: easyqr-server-build.tar.gz
          retention-days: 7

  sdk-test:
    runs-on: ubuntu-latest
    needs: install
    defaults:
      run:
        working-directory: sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sdk/package-lock.json

      - name: Install sdk dependencies
        run: npm ci

      - name: Typecheck sdk
        run: npm run typecheck

      - name: Build sdk
        run: npm run build

      - name: Run sdk tests
        run: npm test

      - name: Build sdk dist artifact
        run: npm run build

      - name: Upload sdk build artifact
        uses: actions/upload-artifact@v4
        with:
          name: easyqr-sdk-build
          path: sdk/dist
          retention-days: 7
