<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>EasyQR Scanner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/mobile/src/styles.css" />
</head>
<body>
  <main class="app-shell">
    <div class="ambient-glow ambient-glow-a"></div>
    <div class="ambient-glow ambient-glow-b"></div>

    <section class="app-card">
      <header class="app-header">
        <div>
          <p class="eyebrow">EasyQR Mobile</p>
          <h1>Scanner</h1>
        </div>
        <span id="statusBadge" class="status-badge">Connecting</span>
      </header>

      <p class="subtitle">
        Pairing is complete. Allow camera access, then scan any barcode to send it straight to the desktop.
      </p>

      <section class="camera-card" id="frame">
        <div class="camera-stage">
          <video id="video" autoplay playsinline muted></video>
          <div class="camera-overlay">
            <div class="scan-window"></div>
            <div class="scan-line"></div>
          </div>
          <div class="camera-placeholder" id="cameraPlaceholder">
            <div class="placeholder-icon">+</div>
            <p>Camera preview will appear here</p>
          </div>
        </div>
      </section>

      <section class="result-card">
        <p class="result-label">Latest Scan</p>
        <p id="scanValue" class="scan-value">Waiting for scan</p>
        <p id="statusText" class="status-text">Connecting to EasyQR...</p>
      </section>

      <button id="startBtn" class="primary-button" type="button" disabled>
        Start Camera
      </button>
    </section>
  </main>

  <script src="/public/demo-config.js"></script>
  <script src="https://unpkg.com/@zxing/library@latest"></script>
  <script src="/mobile/src/scanner.js" defer></script>
</body>
</html>
